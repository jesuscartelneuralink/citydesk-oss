name: CI

on:
  push:
    branches: [main, "feat/**", "test/**", "docs/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway database for integration tests only. Credentials are local to this
      # disposable container; no repository secrets are needed.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: citydesk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d citydesk_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      # The property feature and on-chain mint stay OFF in CI; tests generate their own in-memory keys.
      PROPERTY_ENABLED: ""
      PROPERTY_MINT_ENABLED: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      # Blocking lint for the QA/test files this workflow owns.
      - name: Lint (tests/)
        run: npx eslint tests

      # Whole-repo lint and npm test are blocking. The old baseline errors are fixed.
      - name: Lint (whole repo)
        run: npm run lint

      - name: Unit tests (npm test)
        run: npm test

      # Colony work system P0/P1: ledger, 1-cent rule, kill switch, watch-only addresses, audit, and the
      # blocking no-key guard (fails if key or seed material or signing code appears in src/world/colony).
      - name: Colony tests and no-key guard
        run: npm run test:colony

      # Assistant: tool allowlist, moderation gate, memory, gateway policy, rate limits.
      - name: Assistant unit tests
        run: npm run test:assistant

      # NDU-AI search: on-device semantic + voice ranking. No model download in this test.
      - name: Semantic search tests
        run: npm run test:search

      - name: Property unit tests
        run: |
          if ls src/lib/property/*.test.ts >/dev/null 2>&1; then
            node --experimental-strip-types --test src/lib/property/*.test.ts
          else
            echo "src/lib/property not in this tree yet; skipping"
          fi

      # NDU-AI safe ingest: image strip/pHash/NSFW+face pre/post, scam check, scan cleanup (no network, no models needed)
      - name: Safe ingest tests
        run: npm run test:ingest

      - name: Migrations on PGLite (dev fallback engine)
        run: node tests/property/pglite-dryrun.mjs

      - name: Migrations (dry run on the service DB, twice to prove idempotence)
        env:
          DATABASE_URL: postgres://qa:qa@localhost:5432/citydesk_ci
        run: |
          node scripts/migrate.mjs
          node scripts/migrate.mjs | tee /tmp/migrate2.log
          grep -q "up to date" /tmp/migrate2.log

      - name: Property integration tests
        env:
          TEST_DATABASE_URL: postgres://qa:qa@localhost:5432/citydesk_ci
        run: node --experimental-strip-types --import ./tests/property/register.mjs --test 'tests/property/**/*.test.ts'

      # NDU-UPG sessions: real Better Auth + the session plugin on throwaway PGLite AND this job's postgres:16
      # (each run in its own schema, dropped afterwards). Transform-types: the PGLite Kysely dialect uses
      # TS parameter properties, which strip-only mode rejects.
      - name: Session management tests (PGLite + real Postgres)
        env:
          TEST_DATABASE_URL: postgres://qa:qa@localhost:5432/citydesk_ci
        run: node --experimental-transform-types --no-warnings --import ./tests/property/register.mjs --test 'tests/sessions/**/*.test.ts'
